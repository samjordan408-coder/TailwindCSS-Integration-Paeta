<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rural Bank of Paete Inc.</title>
  <link rel="stylesheet" href="src/output.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <script src="./JS/script.js"></script>
</head>
<body>
  <!-- Header: single blue bar. Put your logo image in assets/header-logo.png -->
  <header class="bg-[#08B3E5] text-white shadow-md" id ="header">
</header>


  <!-- Secondary nav (optional) -->
 <nav id="secondary-nav" class="bg-slate-100/95 py-2.5 px-6"></nav>

<nav id="scroll-nav" class="fixed top-0 left-0 right-0 z-[200] bg-white shadow-lg -translate-y-full opacity-0 pointer-events-none transition-all duration-300"></nav>

  <!-- Sticky nav: hidden at top, appears after scrolling past header -->
  <nav id="scroll-nav" class="fixed top-0 left-0 right-0 z-[200] bg-white shadow-lg -translate-y-full opacity-0 pointer-events-none transition-all duration-300 ease-in-out" aria-label="Sticky navigation">
  
  <div class="max-w-[1200px] mx-auto px-6 py-2 flex items-center justify-between gap-3">
    
    <a href="#hero" class="flex items-center gap-2">
      <img src="./images/logo.png" alt="Rural Bank of Paete" class="h-10 w-10 rounded-full object-contain bg-blue-400/10">
      <div class="flex flex-col leading-tight">
        <span class="font-bold text-[0.75rem] text-[#0d3b66]">Rural Bank of</span>
        <span class="font-bold text-[0.85rem] text-[#0d3b66]">Paete Inc.</span>
      </div>
    </a>

    <button class="w-10 h-10 rounded-full border-[1.5px] border-[#0d3b66]/70 flex flex-col items-center justify-center gap-1.5 cursor-pointer hover:bg-slate-50 transition-colors" type="button" onclick="toggleMenu()">
      <span class="w-5 h-[2px] rounded-full bg-[#0d3b66]"></span>
      <span class="w-5 h-[2px] rounded-full bg-[#0d3b66]"></span>
      <span class="w-5 h-[2px] rounded-full bg-[#0d3b66]"></span>
    </button>
  </div>

  <ul id="side-menu" class="fixed top-0 right-0 h-screen w-80 max-w-[80vw] p-6 pt-20 bg-white shadow-2xl flex flex-col gap-4 translate-x-full transition-transform duration-300 ease-in-out z-[201]">
    
    <li class="absolute top-6 right-6 list-none">
      <button class="w-10 h-10 rounded-full bg-slate-100 text-[#0d3b66] text-3xl flex items-center justify-center cursor-pointer hover:bg-slate-200" onclick="toggleMenu()">&times;</button>
    </li>

    <li class="border-b border-slate-100 pb-2"><a href="#about" class="text-[#0d3b66] font-bold text-lg" onclick="toggleMenu()">About Us</a></li>
    <li class="border-b border-slate-100 pb-2"><a href="#loans" class="text-[#0d3b66] font-bold text-lg" onclick="toggleMenu()">Loan Services</a></li>
    <li class="border-b border-slate-100 pb-2"><a href="#news-updates" class="text-[#0d3b66] font-bold text-lg" onclick="toggleMenu()">News & Updates</a></li>
    <li><a href="#contact" class="text-[#0d3b66] font-bold text-lg" onclick="toggleMenu()">Contact Us</a></li>
  </ul>
</nav>

  <!-- Hero: content + illustration, blue bg with subtle grid -->
<section class="relative min-h-[650px] flex items-center overflow-hidden" id="hero">
</section>

<!-- Account types carousel -->
<div class="relative">

  <!-- LEFT BUTTON -->
  <button id="prevBtn"
    class="absolute left-0 top-1/2 -translate-y-1/2 z-10 bg-white shadow-md w-10 h-10 rounded-full flex items-center justify-center">
    ❮
  </button>

  <!-- CAROUSEL TRACK -->
  <div id="cardTrack"
    class="flex gap-5 overflow-x-auto scroll-smooth snap-x snap-mandatory px-10">
  </div>

  <!-- RIGHT BUTTON -->
  <button id="nextBtn"
    class="absolute right-0 top-1/2 -translate-y-1/2 z-10 bg-white shadow-md w-10 h-10 rounded-full flex items-center justify-center">
    ❯
  </button>

</div>

  <!-- What We Offer section -->
  <section class="relative bg-sky-400 py-12 md:py-20 overflow-hidden" id="what-we-offer">
  </section>


  <!-- About Us section -->
  <section id="about"></section>

<!-- team image -->
<div id="team-section"></div>

  <!-- Loan Services section -->
  <section class="bg-cover bg-top bg-repeat-y py-12" style="background-image: url(./images/about\ us\ bg.jpg);" id="loans">
</section>

  <!-- ================= NEWS ================= -->
  <section 
  id="news-updates" 
  class="text-center bg-[#f4f9ff] bg-cover bg-center bg-no-repeat pb-[60px] font-sans" style="background-image: url('./images/news bg.png');">
</section>

  <!-- ================= MOBILE ================= -->
 <section id="mobile-banking"></section>

  <!-- ================= SECURITY ================= -->
<section id="security-trust"></section>

  <!-- ================= WHY CHOOSE ================= -->
 <section id="why-us" class="bg-[#00aeef] py-[60px] px-[20px] text-center font-[Arial]">
</section>

  <!-- ================= TESTIMONIALS ================= -->
<section id="testimonials"></section>

  <!-- ================= CONTACT ================= -->
  <section id="contact-us" class="font-sans bg-white pb-12">
</section>
<!-- map -->
 <section class="w-full">
  <div id="map-section"></div>
</section>
    
<div id="footer"></div>

<!-- Bottom -->
<div id="copyright">
  
</div>

<script type="module" src="JS/apps.js"></script>
<script type="module" src="JS/rating.js"></script>
</body>
</html>
